# Giữ API Thành Phố Tự Lập luôn thức: gói miễn phí của Render cho server ngủ sau 15 phút không có truy cập.
# Mỗi lượt là một job chạy gần 6 giờ, gọi API mỗi 4 phút; trước khi kết thúc tự gọi lượt tiếp theo,
# nên các lượt nối tiếp nhau liên tục. Lịch hằng giờ chỉ để nối lại chuỗi nếu bị đứt (lịch của GitHub hay trễ, hay bị bỏ qua).
# Lượt mới xếp hàng chờ lượt cũ (không hủy), nên không có hai lượt chạy cùng lúc.
# Repo công khai nên không tốn phút GitHub Actions. Một dịch vụ chạy cả tháng dùng khoảng 720 trong 750 giờ miễn phí của Render.
name: Giữ API thức

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      phut:
        description: Số phút chạy (để thử; mặc định 345)
        required: false
        default: '345'

concurrency:
  group: keepalive
  cancel-in-progress: false

permissions:
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      API_URL: https://thanh-pho-tu-lap.onrender.com
    steps:
      - name: Gọi /health mỗi 4 phút trong gần 6 giờ
        run: |
          end=$((SECONDS + ${{ inputs.phut || '345' }} * 60))
          while [ $SECONDS -lt $end ]; do
            echo "$(date -u +%H:%M:%S) $(curl -s --max-time 120 -o /dev/null -w '%{http_code}' "$API_URL/health")"
            [ $SECONDS -lt $end ] && sleep $(( end - SECONDS < 240 ? end - SECONDS : 240 ))
          done
      - name: Gọi lượt tiếp theo
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run keepalive.yml -R "$GITHUB_REPOSITORY"
